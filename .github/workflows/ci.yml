name: OpsRamp checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build application container
        run: docker build --tag opsramp-portal:ci .

      - name: Check container startup
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs opsramp-ci; docker rm -f opsramp-ci' EXIT
          docker run --detach --name opsramp-ci \
            --publish 127.0.0.1:8000:8000 \
            --env SECRET_KEY=ci-only-not-for-deployment \
            --env APP_USERNAME=ci \
            --env APP_PASSWORD=ci-only-not-for-deployment \
            --env OPSRAMP_BASE_URL=https://example.invalid \
            --env OPSRAMP_PARTNER_TENANT_ID=ci \
            --env OPSRAMP_OAUTH_CLIENT_ID=ci \
            --env OPSRAMP_OAUTH_CLIENT_SECRET=ci \
            --env OVERVIEW_REFRESH_ON_START=false \
            --env OVERVIEW_REFRESH_MINUTES=0 \
            opsramp-portal:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/login; then
              echo "Container login endpoint is responding."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become ready within one minute."
          exit 1
